    - "Drilling break in the {formation} at {md} m followed by partial returns; {vol} m3 lost."
  cause:
    - "Porous, under-pressured sandstone in the {formation}."
    - "Mud weight of {mw} SG above the pore pressure of a depleted sand."
    - "Natural fractures in the {formation} opened by the mud column."
    - "High permeability streak; filter cake did not seal."
    - "Overbalance across a thick sand interval."
  action:
    - "Pumped LCM pill (medium nut plug) and reduced pump rate."
    - "Reduced mud weight by 0.02 SG and spotted a 30 m3 LCM pill."
    - "Stopped drilling, pulled back into the shoe and built the LCM concentration to 60 kg/m3."
    - "Drilled ahead with LCM in the active system at a reduced flow rate."
    - "Spotted a high-fluid-loss squeeze pill across the loss zone."
  outcome:
    - "Losses cured after the second pill; drilling resumed."
